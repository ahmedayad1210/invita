@font-face{font-family:"Plain";src:url("uploads/Plain-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Plain";src:url("uploads/Plain-Bold.otf") format("opentype");font-weight:600 800;font-display:swap}
:root{--font-heading:"Plain","Alexandria",system-ui,sans-serif;--font-body:"Plain","Alexandria",system-ui,sans-serif;--color-divider:color-mix(in srgb,#0D2551 24%,transparent)}
html,body{margin:0;background:#0D2551}
a{color:#0D2551}a:hover{color:#8A6E2E}
[dir="rtl"]{--font-heading:"Alexandria",system-ui,sans-serif;--font-body:"Alexandria",system-ui,sans-serif}
.inv-show-m{display:none !important}
@media (max-width:760px){.inv-hide-m{display:none !important}.inv-show-m{display:inline-flex !important}}

/* ── premium motion layer ── */
@keyframes invUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes invGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes invKen{from{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes invNavShadow{from{box-shadow:0 0 0 rgba(10,20,40,0)}to{box-shadow:0 10px 34px rgba(10,20,40,.1)}}
@supports (animation-timeline: view()){
main>section,main>header>div{animation:invUp .8s cubic-bezier(.2,.7,.2,1) both;animation-timeline:view();animation-range:entry 0% entry 24%}
hr.hr{transform-origin:0 50%;animation:invGrowX 1.1s cubic-bezier(.2,.7,.2,1) both;animation-timeline:view();animation-range:entry 0% entry 40%}
nav.nav{animation:invNavShadow .01s linear both;animation-timeline:scroll(root);animation-range:0 140px}
}
header[data-screen-label] img{animation:invKen 12s cubic-bezier(.2,.6,.3,1) both}
.card{transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s cubic-bezier(.2,.7,.2,1),border-color .45s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 26px 52px rgba(15,35,65,.15)}
a.btn,button.btn{transition:transform .3s ease,box-shadow .3s ease,filter .3s ease}
a.btn:hover,button.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(15,35,65,.2)}
a.btn:active,button.btn:active{transform:translateY(0)}
figure{overflow:visible}
figure div{overflow:hidden}
figure img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
figure:hover img{transform:scale(1.04)}
::selection{background:#C3A15A;color:#0D2551}
main h1,main h2{text-wrap:balance}
@media (prefers-reduced-motion:reduce){main>section,main>header>div,hr.hr,header[data-screen-label] img{animation:none!important}figure img{transition:none}}

main a:not([class*="btn"]):hover{text-decoration-color:#C3A15A;text-underline-offset:3px}
</style>
